<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>LAST — Espace cabinet AEM-CONSEIL</title>
<meta name="theme-color" content="#04050b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232b45ff'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='19' font-weight='700' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --noir:#04050b;--noir2:#070912;--noir3:#0b0e1a;
    --outremer:#2b45ff;--azur:#6d86ff;--peri:#a9b8ff;
    --line:rgba(150,168,255,.11);--line-2:rgba(150,168,255,.18);
    --glass:rgba(255,255,255,.035);--glass-2:rgba(255,255,255,.06);
    --txt:#f2f4ff;--txt2:#8b98bd;--pos:#3ee9a4;--danger:#ff6b7d;--warn:#ffcf7a;
    --font:'Inter Tight',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--font);color:var(--txt);background:var(--noir);-webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:radial-gradient(820px 600px at 50% -10%,rgba(43,69,255,.20),transparent 60%),linear-gradient(180deg,#05060e,#04050b)}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--glass-2);color:var(--txt);border-radius:11px;padding:10px 15px;font-weight:600;font-size:14px;transition:.16s}
  .btn:hover{border-color:var(--azur)}
  .btn-pri{border:none;background:linear-gradient(135deg,var(--outremer),#7c3aff);color:#fff}
  .btn-pri:hover{filter:brightness(1.08)}
  .btn-emit{border:none;background:linear-gradient(135deg,#7bf0bd,#22b573);color:#04120b}
  .btn-emit:hover{filter:brightness(1.06)}
  .btn-sm{padding:7px 11px;font-size:12.5px;border-radius:9px}

  /* Topbar */
  .top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:rgba(4,5,11,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:-.01em;font-size:17px}
  .brand .mk{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--outremer),#7c3aff);color:#fff;font-size:13px;font-weight:800}
  .brand small{display:block;font-weight:400;font-size:10.5px;color:var(--txt2);letter-spacing:.02em}
  .top .sp{flex:1}
  .who{font-size:12.5px;color:var(--txt2)}

  .wrap{display:grid;grid-template-columns:210px 1fr;gap:0;min-height:calc(100vh - 60px)}
  .side{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:3px}
  .nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--txt2);font-weight:600;font-size:13.5px;border:1px solid transparent}
  .nav svg{width:17px;height:17px}
  .nav.on{background:var(--glass-2);color:var(--txt);border-color:var(--line-2)}
  .nav:hover{color:var(--txt)}
  .nav .soon{margin-left:auto;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt2);border:1px solid var(--line);border-radius:999px;padding:2px 6px}
  .main{padding:24px 26px;min-width:0}
  h1{font-size:22px;letter-spacing:-.01em}
  .lead{color:var(--txt2);font-size:13.5px;margin-top:4px}

  /* Filtres */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 16px}
  .chip{border:1px solid var(--line-2);background:var(--glass);color:var(--txt2);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600}
  .chip.on{background:linear-gradient(135deg,rgba(43,69,255,.22),rgba(124,58,255,.18));color:#fff;border-color:rgba(140,120,255,.45)}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0 4px}
  .stat{flex:1;min-width:118px;border:1px solid var(--line-2);border-radius:14px;background:var(--glass);padding:14px 16px}
  .stat .n{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt2);margin-top:6px}
  .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}
  .search{flex:1;min-width:200px;background:var(--glass-2);border:1px solid var(--line-2);border-radius:11px;color:var(--txt);padding:10px 14px;font-family:inherit;font-size:14px}
  .search:focus{outline:none;border-color:var(--azur)}
  .viewtabs{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line-2);border-radius:12px;background:var(--glass-2)}
  .viewtabs button{border:none;background:none;color:var(--txt2);font-family:inherit;font-weight:600;font-size:13px;padding:7px 14px;border-radius:8px;cursor:pointer}
  .viewtabs button.on{background:linear-gradient(135deg,var(--outremer),#7c3aff);color:#fff}
  /* Kanban */
  .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:4px}
  .kanban.hidden,.card.hidden{display:none}
  .kcol{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:140px;transition:.14s}
  .kcol.drag{border-color:var(--azur);background:var(--glass-2)}
  .kcol h4{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--txt2);display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:700}
  .kcol h4 .c{margin-left:auto;font-size:11px;color:var(--txt2);background:var(--glass-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  .kcard{background:var(--noir3);border:1px solid var(--line-2);border-radius:11px;padding:11px 12px;margin-bottom:9px;cursor:grab}
  .kcard:active{cursor:grabbing}
  .kcard .who{font-weight:600;font-size:13.5px}
  .kcard .kmeta{font-size:11.5px;color:var(--txt2);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .kcard .pri{font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:999px;border:1px solid var(--line-2)}
  .kcard .pri.haute{color:#ff9c9c;border-color:rgba(255,107,125,.4)}
  .kempty{color:var(--txt2);font-size:12px;padding:8px 4px}
  .drawer .btn-line{display:flex;gap:10px;margin-top:16px}
  .drawer .btn-line .btn{flex:1;justify-content:center}
  @media(max-width:900px){.kanban{grid-template-columns:1fr 1fr}}
  @media(max-width:560px){.kanban{grid-template-columns:1fr}}

  /* Liste demandes */
  .card{border:1px solid var(--line-2);border-radius:16px;background:var(--glass);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt2);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line)}
  td{padding:13px 16px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer;transition:.12s}
  tbody tr:hover{background:var(--glass-2)}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2)}
  .badge .d{width:6px;height:6px;border-radius:50%}
  .src{font-size:11px;color:var(--peri);text-transform:uppercase;letter-spacing:.04em}
  .empty,.notice{padding:40px 20px;text-align:center;color:var(--txt2);font-size:14px}
  .notice{border:1px solid rgba(255,207,122,.3);background:rgba(255,207,122,.07);border-radius:14px;color:var(--warn);text-align:left;padding:18px 20px;font-size:13px;line-height:1.6}
  .notice code{background:var(--glass-2);border:1px solid var(--line);padding:1px 6px;border-radius:5px}

  /* Drawer détail */
  .drawer-ov{position:fixed;inset:0;background:rgba(2,3,8,.6);z-index:40;opacity:0;pointer-events:none;transition:.2s}
  .drawer-ov.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,94vw);background:var(--noir2);border-left:1px solid var(--line-2);z-index:41;transform:translateX(100%);transition:.24s;padding:24px;overflow:auto}
  .drawer.open{transform:none}
  .drawer h3{font-size:18px}
  .drawer .row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .drawer .row span{color:var(--txt2)}
  .drawer label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt2);margin:16px 0 6px;font-weight:600}
  .drawer select,.drawer textarea{width:100%;background:var(--glass-2);border:1px solid var(--line-2);border-radius:10px;color:var(--txt);padding:10px 12px;font-family:inherit;font-size:14px}
  .drawer .msg{margin-top:8px;padding:12px 14px;background:var(--glass);border:1px solid var(--line);border-radius:10px;font-size:13.5px;white-space:pre-wrap}
  .x{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--txt2);font-size:20px}

  /* Auth gate */
  .gate{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:24px;background:radial-gradient(700px 500px at 50% 0%,rgba(43,69,255,.16),transparent 60%),var(--noir)}
  .gate[hidden]{display:none}
  .authcard{width:100%;max-width:380px;background:linear-gradient(180deg,rgba(11,14,26,.92),rgba(5,7,14,.95));border:1px solid var(--line-2);border-radius:18px;padding:28px}
  .authcard .brand{margin-bottom:16px}
  .authcard label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--txt2);margin:14px 0 6px;font-weight:600}
  .authcard input{width:100%;padding:11px 13px;background:var(--noir);border:1px solid var(--line-2);border-radius:10px;color:var(--txt);font-size:14px;font-family:inherit}
  .authcard input:focus{outline:none;border-color:var(--azur)}
  .authcard .submit{width:100%;margin-top:18px}
  .authmsg{margin-top:12px;font-size:12.5px;color:var(--danger);min-height:16px}
  .hidden{display:none!important}
  @media(max-width:720px){.wrap{grid-template-columns:1fr}.side{flex-direction:row;overflow:auto;border-right:none;border-bottom:1px solid var(--line)}.nav .soon{display:none}}
</style>
</head>
<body>

<!-- ====== Connexion ====== -->
<div class="gate" id="gate" hidden>
  <form class="authcard" id="authForm" autocomplete="on">
    <div class="brand"><span class="mk">L</span><span>LAST<small>Espace cabinet AEM-CONSEIL</small></span></div>
    <label for="email">Adresse e-mail</label>
    <input id="email" type="email" required autocomplete="email" placeholder="vous@aemconseil.eu">
    <label for="pass">Mot de passe</label>
    <input id="pass" type="password" required autocomplete="current-password" placeholder="••••••••">
    <button class="btn btn-pri submit" type="submit" id="authBtn">Se connecter</button>
    <div class="authmsg" id="authMsg" role="status"></div>
  </form>
</div>

<!-- ====== Application ====== -->
<div id="app" class="hidden">
  <div class="top">
    <div class="brand"><span class="mk">L</span><span>LAST<small>Formalités & demandes</small></span></div>
    <div class="sp"></div>
    <span class="who" id="who"></span>
    <button class="btn btn-sm" id="logout">Se déconnecter</button>
  </div>

  <div class="wrap">
    <nav class="side">
      <a class="nav on" id="nav-demandes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v12H5.2L4 17.2V4z"/><path d="M8 9h8M8 12h5"/></svg>
        Demandes
      </a>
      <a class="nav" id="nav-dossiers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h6l2 2h10v10H3V7z"/></svg>
        Dossiers <span class="soon">Bientôt</span>
      </a>
      <a class="nav" id="nav-clients">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
        Clients <span class="soon">Bientôt</span>
      </a>
    </nav>

    <main class="main">
      <h1>Boîte de réception</h1>
      <p class="lead">Toutes les demandes reçues depuis aemconseil.eu.</p>

      <div id="configNotice" class="notice hidden" style="margin-top:20px"></div>

      <div class="stats" id="stats"></div>

      <div class="toolbar">
        <div class="filters" id="filters">
          <button class="chip on" data-f="statut" data-v="">Toutes</button>
          <button class="chip" data-f="statut" data-v="nouveau">Nouvelles</button>
          <button class="chip" data-f="statut" data-v="qualifie">Qualifiées</button>
          <button class="chip" data-f="statut" data-v="en_cours">En cours</button>
          <button class="chip" data-f="statut" data-v="converti">Converties</button>
        </div>
        <input class="search" id="search" placeholder="Rechercher un nom, e-mail, entreprise…" autocomplete="off">
        <div class="viewtabs" id="viewtabs">
          <button type="button" data-view="liste" class="on">Liste</button>
          <button type="button" data-view="kanban">Kanban</button>
        </div>
      </div>

      <div class="card" id="listView">
        <table>
          <thead><tr><th>Reçue le</th><th>Source</th><th>Demandeur</th><th>Objet</th><th>Statut</th></tr></thead>
          <tbody id="rows"><tr><td colspan="5" class="empty">Chargement…</td></tr></tbody>
        </table>
      </div>
      <div class="kanban hidden" id="kanbanView"></div>
    </main>
  </div>
</div>

<!-- Drawer détail -->
<div class="drawer-ov" id="drawerOv" onclick="LASTUI.close()"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="x" onclick="LASTUI.close()" aria-label="Fermer">×</button>
  <h3 id="dTitle">Demande</h3>
  <div id="dBody"></div>
</aside>

<script>
/* ============================================================================
   CONFIGURATION — à renseigner avec le projet Supabase dédié de LAST
   ========================================================================== */
var SUPABASE_URL = '';   // ex. 'https://xxxx.supabase.co'
var SUPABASE_ANON = '';  // clé publishable (anon)

var STATUTS = {
  nouveau:{l:'Nouvelle',c:'#6d86ff'}, qualifie:{l:'Qualifiée',c:'#a9b8ff'},
  en_cours:{l:'En cours',c:'#ffcf7a'}, converti:{l:'Convertie',c:'#3ee9a4'},
  perdu:{l:'Perdue',c:'#ff6b7d'}, clos:{l:'Clôturée',c:'#8b98bd'}
};
var SOURCES = {contact:'Contact',rappel:'Rappel',rdv:'Rendez-vous',newsletter:'Newsletter',kit:'Kit',chatbot:'Chatbot',identification:'Identification',autre:'Autre'};

var sb = null, filterStatut = '', view = 'liste', PROFILS = [];

function el(id){ return document.getElementById(id); }
function fmtDate(iso){ try{ var d=new Date(iso); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

/* ---------- Démarrage ---------- */
function boot(){
  if(!SUPABASE_URL || !SUPABASE_ANON){
    // Mode non configuré : on montre l'appli avec une notice de configuration.
    el('gate').hidden = true; el('app').classList.remove('hidden');
    var n = el('configNotice'); n.classList.remove('hidden');
    n.innerHTML = '⚙︎ <b>Configuration requise.</b> Renseignez <code>SUPABASE_URL</code> et '
      + '<code>SUPABASE_ANON</code> dans <code>index.html</code>, puis exécutez '
      + '<code>supabase/schema.sql</code> et déployez la fonction <code>intake</code>. '
      + 'Voir <code>README.md</code>.';
    el('rows').innerHTML = '<tr><td colspan="5" class="empty">En attente de configuration Supabase.</td></tr>';
    el('logout').classList.add('hidden');
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.getSession().then(function(res){
    if(res.data && res.data.session) onAuth(res.data.session);
    else el('gate').hidden = false;
  });
}

/* ---------- Connexion ---------- */
el('authForm').addEventListener('submit', function(e){
  e.preventDefault();
  var btn=el('authBtn'); btn.disabled=true; el('authMsg').textContent='';
  sb.auth.signInWithPassword({ email: el('email').value.trim(), password: el('pass').value })
    .then(function(res){
      btn.disabled=false;
      if(res.error){ el('authMsg').textContent = 'Identifiants incorrects.'; return; }
      onAuth(res.data.session);
    });
});
el('logout').addEventListener('click', function(){ if(sb) sb.auth.signOut().then(function(){ location.reload(); }); });

function onAuth(session){
  el('gate').hidden = true; el('app').classList.remove('hidden');
  el('who').textContent = (session.user && session.user.email) || '';
  loadProfils();
  loadDemandes();
}

/* ---------- Filtres ---------- */
el('filters').addEventListener('click', function(e){
  var c = e.target.closest('.chip'); if(!c) return;
  el('filters').querySelectorAll('.chip').forEach(function(x){ x.classList.remove('on'); });
  c.classList.add('on'); filterStatut = c.getAttribute('data-v'); render();
});
el('search').addEventListener('input', render);
el('viewtabs').addEventListener('click', function(e){
  var btn = e.target.closest('button[data-view]'); if(!btn) return;
  view = btn.getAttribute('data-view');
  el('viewtabs').querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x===btn); });
  el('listView').classList.toggle('hidden', view!=='liste');
  el('kanbanView').classList.toggle('hidden', view!=='kanban');
  el('filters').style.display = (view==='kanban') ? 'none' : '';
  render();
});

/* ---------- Chargement des demandes ---------- */
var ALL = [];
function loadDemandes(){
  el('rows').innerHTML = '<tr><td colspan="5" class="empty">Chargement…</td></tr>';
  sb.from('demandes').select('*').order('cree_le',{ascending:false}).limit(500).then(function(res){
    if(res.error){ el('rows').innerHTML = '<tr><td colspan="5" class="empty">Erreur : '+esc(res.error.message)+'</td></tr>'; return; }
    ALL = res.data || [];
    window.__rows = {}; ALL.forEach(function(d){ window.__rows[d.id]=d; });
    renderStats(); render();
  });
}
function render(){ if(view === 'kanban') renderKanban(); else renderRows(); }
function loadProfils(){
  sb.from('profils').select('id,nom,role').then(function(res){ if(!res.error) PROFILS = res.data || []; });
}
var KCOLS = ['nouveau','qualifie','en_cours','converti'];
function renderKanban(){
  var query = (el('search').value||'').toLowerCase().trim();
  var data = ALL.filter(function(d){
    if(!query) return true;
    var hay = [d.prenom,d.nom,d.email,d.entreprise,d.objet,d.telephone,d.siren].filter(Boolean).join(' ').toLowerCase();
    return hay.indexOf(query) >= 0;
  });
  el('kanbanView').innerHTML = KCOLS.map(function(k){
    var s = STATUTS[k], items = data.filter(function(d){ return d.statut===k; });
    var cards = items.map(function(d){
      var who = esc([d.prenom,d.nom].filter(Boolean).join(' ') || d.email || d.entreprise || '—');
      var pri = d.priorite==='haute' ? '<span class="pri haute">Haute</span>' : '';
      return '<div class="kcard" draggable="true" data-id="'+d.id+'">'
        + '<div class="who">'+who+'</div>'
        + '<div class="kmeta"><span>'+esc(SOURCES[d.source]||d.source)+'</span><span>'+fmtDate(d.cree_le)+'</span>'+pri+'</div>'
        + '</div>';
    }).join('') || '<div class="kempty">—</div>';
    return '<div class="kcol" data-statut="'+k+'"><h4><span style="width:7px;height:7px;border-radius:50%;background:'+s.c+';display:inline-block"></span>'+s.l+'<span class="c">'+items.length+'</span></h4>'+cards+'</div>';
  }).join('');
  wireKanbanDnD();
}
var _dragId = null;
function wireKanbanDnD(){
  el('kanbanView').querySelectorAll('.kcard').forEach(function(card){
    card.addEventListener('click', function(){ if(card._moved) { card._moved=false; return; } LASTUI.open(card.getAttribute('data-id')); });
    card.addEventListener('dragstart', function(e){ _dragId = card.getAttribute('data-id'); card._moved=true; try{ e.dataTransfer.effectAllowed='move'; }catch(x){} });
    card.addEventListener('dragend', function(){ setTimeout(function(){ card._moved=false; }, 60); });
  });
  el('kanbanView').querySelectorAll('.kcol').forEach(function(col){
    col.addEventListener('dragover', function(e){ e.preventDefault(); col.classList.add('drag'); });
    col.addEventListener('dragleave', function(){ col.classList.remove('drag'); });
    col.addEventListener('drop', function(e){ e.preventDefault(); col.classList.remove('drag'); var st=col.getAttribute('data-statut'); if(_dragId && st) updateStatut(_dragId, st); _dragId=null; });
  });
}
function updateStatut(id, statut){
  var d = (window.__rows||{})[id]; if(!d || d.statut===statut) return;
  d.statut = statut; renderStats(); render();
  sb.from('demandes').update({ statut: statut, maj_le: new Date().toISOString() }).eq('id', id)
    .then(function(res){ if(res.error) loadDemandes(); });
}
function renderStats(){
  var order = ['nouveau','qualifie','en_cours','converti'];
  el('stats').innerHTML = order.map(function(k){
    var n = ALL.filter(function(d){ return d.statut===k; }).length, s = STATUTS[k];
    return '<div class="stat"><div class="n" style="color:'+s.c+'">'+n+'</div><div class="k">'+s.l+'</div></div>';
  }).join('') + '<div class="stat"><div class="n">'+ALL.length+'</div><div class="k">Total</div></div>';
}
function renderRows(){
  var query = (el('search').value||'').toLowerCase().trim();
  var rows = ALL.filter(function(d){
    if(filterStatut && d.statut!==filterStatut) return false;
    if(query){
      var hay = [d.prenom,d.nom,d.email,d.entreprise,d.objet,d.telephone,d.siren].filter(Boolean).join(' ').toLowerCase();
      if(hay.indexOf(query) < 0) return false;
    }
    return true;
  });
  if(!rows.length){ el('rows').innerHTML = '<tr><td colspan="5" class="empty">Aucune demande.</td></tr>'; return; }
  el('rows').innerHTML = rows.map(function(d){
    var s = STATUTS[d.statut] || STATUTS.nouveau;
    var who = esc([d.prenom,d.nom].filter(Boolean).join(' ') || d.email || d.entreprise || '—');
    return '<tr onclick="LASTUI.open(\''+d.id+'\')">'
      + '<td>'+fmtDate(d.cree_le)+'</td>'
      + '<td><span class="src">'+esc(SOURCES[d.source]||d.source)+'</span></td>'
      + '<td>'+who+'</td>'
      + '<td>'+esc(d.objet||d.type||'—')+'</td>'
      + '<td><span class="badge"><span class="d" style="background:'+s.c+'"></span>'+s.l+'</span></td>'
      + '</tr>';
  }).join('');
}

/* ---------- Drawer détail + mise à jour ---------- */
var LASTUI = {
  open: function(id){
    var d = (window.__rows||{})[id]; if(!d) return;
    el('dTitle').textContent = [d.prenom,d.nom].filter(Boolean).join(' ') || d.email || 'Demande';
    var opts = Object.keys(STATUTS).map(function(k){ return '<option value="'+k+'"'+(k===d.statut?' selected':'')+'>'+STATUTS[k].l+'</option>'; }).join('');
    var priL = {basse:'Basse',normale:'Normale',haute:'Haute'};
    var priOpts = ['basse','normale','haute'].map(function(p){ return '<option value="'+p+'"'+(((d.priorite||'normale')===p)?' selected':'')+'>'+priL[p]+'</option>'; }).join('');
    var assignOpts = '<option value="">— Non attribué —</option>' + PROFILS.map(function(p){ return '<option value="'+p.id+'"'+(d.assigned_to===p.id?' selected':'')+'>'+esc(p.nom||p.id)+'</option>'; }).join('');
    el('dBody').innerHTML =
      '<div class="row"><span>Source</span><b>'+esc(SOURCES[d.source]||d.source)+'</b></div>'
      + (d.email?'<div class="row"><span>E-mail</span><a href="mailto:'+esc(d.email)+'">'+esc(d.email)+'</a></div>':'')
      + (d.telephone?'<div class="row"><span>Téléphone</span><a href="tel:'+esc(d.telephone)+'">'+esc(d.telephone)+'</a></div>':'')
      + (d.entreprise?'<div class="row"><span>Entreprise</span><b>'+esc(d.entreprise)+'</b></div>':'')
      + (d.siren?'<div class="row"><span>SIREN</span><b>'+esc(d.siren)+'</b></div>':'')
      + '<div class="row"><span>Reçue le</span><b>'+fmtDate(d.cree_le)+'</b></div>'
      + (d.message?'<label>Message</label><div class="msg">'+esc(d.message)+'</div>':'')
      + '<label for="dStatut">Statut</label><select id="dStatut">'+opts+'</select>'
      + '<label for="dPriorite">Priorité</label><select id="dPriorite">'+priOpts+'</select>'
      + '<label for="dAssign">Responsable</label><select id="dAssign">'+assignOpts+'</select>'
      + '<label for="dNote">Note interne</label><textarea id="dNote" rows="3" placeholder="Ajouter une note…">'+esc((d.meta&&d.meta.note)||'')+'</textarea>'
      + '<div class="btn-line">'
      +   (d.client_id ? '<span class="btn" style="opacity:.6;pointer-events:none">✓ Client créé</span>' : '<button class="btn" onclick="LASTUI.convert(\''+d.id+'\')">Convertir en client</button>')
      +   '<button class="btn btn-pri" onclick="LASTUI.save(\''+d.id+'\')">Enregistrer</button>'
      + '</div>'
      + '<button class="btn btn-emit" style="width:100%;margin-top:10px" onclick="LASTUI.facture(\''+d.id+'\')">Créer la facture sur yada <span aria-hidden="true">→</span></button>'
      + '<div style="font-size:11.5px;color:var(--txt2);margin-top:8px;line-height:1.5">Ouvre la facturation avec les informations du client pré-remplies. Connectez-vous pour émettre la facture.</div>';
    el('drawer').classList.add('open'); el('drawerOv').classList.add('open'); el('drawer').setAttribute('aria-hidden','false');
  },
  save: function(id){
    var statut = el('dStatut').value, note = el('dNote').value;
    var priorite = el('dPriorite').value, assigned = el('dAssign').value || null;
    var meta = Object.assign({}, ((window.__rows||{})[id]||{}).meta||{}, { note: note });
    sb.from('demandes').update({ statut: statut, priorite: priorite, assigned_to: assigned, meta: meta, maj_le: new Date().toISOString() }).eq('id', id)
      .then(function(res){ if(!res.error){ LASTUI.close(); loadDemandes(); } else { alert('Erreur : '+res.error.message); } });
  },
  convert: function(id){
    var d = (window.__rows||{})[id]; if(!d) return;
    var isSoc = !!(d.siren || d.entreprise);
    var client = { type: isSoc?'societe':'particulier', siren: d.siren||null, raison_sociale: d.entreprise||null,
      nom: d.nom||null, prenom: d.prenom||null, email: d.email||null, telephone: d.telephone||null,
      adresse: (d.meta&&d.meta.adresse)||null, source_demande_id: d.id };
    sb.from('clients').insert(client).select('id').single().then(function(res){
      if(res.error){ alert('Conversion impossible : '+res.error.message); return; }
      sb.from('demandes').update({ client_id: res.data.id, statut:'converti', maj_le:new Date().toISOString() }).eq('id', id)
        .then(function(){ LASTUI.close(); loadDemandes(); });
    });
  },
  facture: function(id){
    // Pont LAST → yada : ouvre la facturation avec le CLIENT pré-rempli.
    var d = (window.__rows||{})[id]; if(!d) return;
    var isSoc = !!(d.siren || d.entreprise);
    var cnom = isSoc ? (d.entreprise||'') : [d.prenom,d.nom].filter(Boolean).join(' ');
    var q = [];
    function add(k,v){ if(v) q.push(encodeURIComponent(k)+'='+encodeURIComponent(v)); }
    add('fclient','1');
    add('cnom', cnom);
    add('cadresse', (d.meta&&d.meta.adresse)||'');
    add('csiret', d.siret || (d.meta&&d.meta.siret) || d.siren || '');
    add('cemail', d.email||'');
    var url = 'https://yada.aemconseil.eu/' + (q.length?'?'+q.join('&'):'') + '#facturation';
    window.open(url, '_blank', 'noopener');
  },
  close: function(){ el('drawer').classList.remove('open'); el('drawerOv').classList.remove('open'); el('drawer').setAttribute('aria-hidden','true'); }
};
window.LASTUI = LASTUI;
document.addEventListener('keydown', function(e){ if(e.key==='Escape') LASTUI.close(); });

/* PWA */
if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js').catch(function(){}); }); }

boot();
</script>
</body>
</html>
